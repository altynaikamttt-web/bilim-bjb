<!doctype html>
<html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilim • Информатика БЖБ</title>
<style>
:root{--navy:#142b45;--blue:#2764e7;--muted:#61718a;--line:#dce4ee;--paper:#f3f6fb;--green:#087f66}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 19px;background:var(--blue);color:white;font-weight:600}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:wait}button.secondary{color:var(--navy);background:#eaf0fa}button.ghost{background:transparent;color:var(--muted)}button.danger{background:#b3314b}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c8d4e3;border-radius:9px;background:white;color:var(--navy)}textarea{min-height:88px}label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}h1,h2,h3,p{margin-top:0}h1{font-size:38px;line-height:1.2;letter-spacing:-1px}h2{font-size:25px;line-height:1.3}h3{font-size:19px}small,.muted{color:var(--muted)}header{background:white;border-bottom:1px solid var(--line)}.head{max-width:1220px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;gap:15px}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:23px}.logo{background:var(--blue);color:white;border-radius:12px;padding:5px 13px}.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:1px}.shell{max-width:1220px;padding:30px 26px 60px;margin:auto}.hero{background:var(--navy);border-radius:20px;color:white;padding:36px 40px;display:grid;grid-template-columns:1fr auto;gap:20px;margin-bottom:27px;position:relative;overflow:hidden}.hero p{color:#bfd0e4;max-width:670px;margin-bottom:0}.hero h1{max-width:710px;margin:10px 0 16px}.eyebrow{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#98bafa}.hero-art{align-self:center;border:1px solid #4c6885;border-radius:20px;padding:18px 27px;font:700 45px/1.3 monospace;color:#8ab2ff;transform:rotate(-5deg)}.hero-art small{font:14px system-ui;color:#d4e4ff;display:block}.bar,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between;margin:22px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:white;color:var(--muted);border:1px solid var(--line)}.tabs button.on{background:var(--blue);color:white;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:23px}.card{display:flex;flex-direction:column;gap:12px}.card h3{margin:4px 0}.card p{margin:0}.card .row:last-child{margin-top:auto}.badge{display:inline-block;background:#edf3ff;color:#2854aa;border-radius:6px;padding:3px 9px;font-size:13px;font-weight:650}.badge.sample{background:#fff3d6;color:#89620b}.meta{font-size:14px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px}.stat{padding:18px 24px;background:white;border:1px solid var(--line);border-radius:13px}.stat strong{font-size:30px;display:block;line-height:1.3}.stat span{font-size:14px;color:var(--muted)}.notice{padding:13px 17px;background:#fff6dc;border:1px solid #efdeab;border-radius:10px;color:#70551b;font-size:14px;margin:17px 0}.empty{text-align:center;padding:45px;background:white;border:1px dashed #becde0;border-radius:14px;color:var(--muted)}dialog{border:0;border-radius:17px;padding:28px;max-width:550px;width:calc(100% - 30px);color:var(--navy);box-shadow:0 25px 100px #0a22374d}dialog::backdrop{background:#10283f88}.dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.wide{grid-column:1/-1}.question-editor{border:1px solid var(--line);border-radius:12px;padding:19px;margin:17px 0;background:#f8faff}.option-edit{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:10px;margin:8px 0}.option-edit input[type=radio]{width:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:14px}th{color:var(--muted);background:#f7f9fd;font-weight:600}th,td{padding:13px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}.exam-layout{display:grid;grid-template-columns:1fr 265px;gap:25px}.exam-q{margin-bottom:18px}.option{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;margin:8px 0;font-weight:400;font-size:16px}.option:has(input:checked){background:#eef4ff;border-color:var(--blue)}.option input{width:19px;flex-shrink:0}.timer{font-size:35px;font-weight:750;font-variant-numeric:tabular-nums}.sticky{position:sticky;top:20px;align-self:start}.progress{height:7px;border-radius:10px;background:#e3eaf5;margin:15px 0}.progress span{display:block;background:var(--blue);height:100%;border-radius:10px}.result-number{font-size:64px;color:var(--blue);font-weight:800;line-height:1.2}.success{color:var(--green)}.error{color:#b32644}.feedback{min-height:25px;color:#b32644;margin-top:10px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#142b45;color:white;padding:12px 22px;border-radius:10px;z-index:20;display:none}footer{border-top:1px solid var(--line);padding:20px 0;margin-top:40px;color:var(--muted);font-size:14px}.report-answer{white-space:pre-wrap}.report-item{padding:16px 0;border-bottom:1px solid var(--line)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.hero-art{display:none}.hero{grid-template-columns:1fr}.exam-layout{grid-template-columns:1fr}.sticky{position:static;grid-row:1}}@media(max-width:600px){.grid,.formgrid{grid-template-columns:1fr}.shell{padding:20px 15px}.hero{padding:25px}.hero h1{font-size:29px}.head{padding:15px}.brand small{display:none}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:25px}.wide{grid-column:auto}}@media print{header,footer,.no-print,#toast,dialog{display:none!important}body{background:white;font-size:12px}.shell{max-width:none;padding:0}.panel{border:0;padding:0}button{display:none!important}.report-item{break-inside:avoid}h1{font-size:24px}.report-answer{overflow-wrap:anywhere}}
</style>
<header><div class="head"><div class="brand"><span class="logo">B.</span><div>Bilim <small>ЦИФРЛЫҚ БАҒАЛАУ</small></div></div><div class="row"><span id="roleLabel" class="badge">Оқушы кабинеті</span><button id="roleBtn" class="secondary" onclick="teacherEntry()">Мұғалімге кіру</button></div></div></header>
<main class="shell" id="app"></main><div id="toast" role="status"></div><dialog id="modal"></dialog>
<script src="./config.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('bilim_teacher')||'', exams=[],results=[],grade=0,teacher=false,tab='collection',attempt=null,interval=null,draft=[],sending=false,nextAutoRetry=0;
const app=$('#app');
const cfg=window.BILIM_CONFIG||{};
const backend=(cfg.url||'').replace(/\/$/,'');
const configured=()=>/^https:\/\/[a-z0-9.-]+$/i.test(backend)&&!!cfg.anonKey&&!cfg.anonKey.includes('PASTE_');
async function raw(path,data,authToken){
 const headers={'Content-Type':'application/json',apikey:cfg.anonKey};
 if(authToken)headers.Authorization='Bearer '+authToken;
 const r=await fetch(backend+path,{method:'POST',headers,body:JSON.stringify(data)});
 const x=await r.json();if(!r.ok)throw Error(x.message||x.error_description||x.msg||x.error||'Қосылу қатесі');return x;
}
async function refreshAuth(){
 const saved=JSON.parse(sessionStorage.getItem('bilim_auth')||'null');
 if(saved&&saved.expires_at<Date.now()/1000+60){
  const x=await raw('/auth/v1/token?grant_type=refresh_token',{refresh_token:saved.refresh_token});
  saveAuth(x);
 }
}
function saveAuth(x){token=x.access_token;sessionStorage.setItem('bilim_teacher',token);sessionStorage.setItem('bilim_auth',JSON.stringify({...x,expires_at:Date.now()/1000+x.expires_in}));}
async function api(path,data){
 if(!configured())throw Error('Онлайн дерекқор қосылмаған. Алдымен config.js файлын баптаңыз.');
 if(path==='login'){
  const x=await raw('/auth/v1/token?grant_type=password',{email:data.email,password:data.password});
  try{await raw('/rest/v1/rpc/bilim_api',{action:'whoami',payload:{}},x.access_token)}catch(e){try{await raw('/auth/v1/logout',{},x.access_token)}catch{}throw e}
  saveAuth(x);return {token};
 }
 if(path==='logout'){
  try{if(token)await raw('/auth/v1/logout',{},token)}catch{}finally{sessionStorage.removeItem('bilim_auth')}
  return {ok:true};
 }
 if(token)await refreshAuth();
 return raw('/rest/v1/rpc/bilim_api',{action:path==='exams'&&data?'save_exam':path,payload:data||{}},token||null);
}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
async function teacherEntry(){
 if(attempt){toast('Алдымен жұмысты аяқтаңыз');return}
 if(teacher){await api('logout',{});token='';sessionStorage.removeItem('bilim_teacher');teacher=false;tab='collection';await home();return}
 if(!configured()){showSetup();return}
 modal(`<h2>Мұғалім кабинеті</h2><p class="muted">Supabase жүйесінде тіркелген және мұғалім құқығы берілген аккаунтпен кіріңіз.</p><form onsubmit="login(event)"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"><label for="pw">Құпиясөз</label><input id="pw" type="password" required autocomplete="current-password"><div id="loginError" class="feedback" role="alert"></div><div class="dialog-actions"><button type="button" class="secondary" onclick="closeModal()">Жабу</button><button>Кіру</button></div></form>`);
}
async function login(e){e.preventDefault();const b=e.submitter;b.disabled=true;try{await api('login',{email:$('#email').value.trim(),password:$('#pw').value});teacher=true;closeModal();await home()}catch(e){$('#loginError').textContent=e.message}finally{b.disabled=false}}
function showSetup(){
 setRole();app.innerHTML=`<section class="hero"><div><span class="eyebrow">GitHub Pages нұсқасы</span><h1>Онлайн БЖБ ортасын қосу</h1><p>Интерфейс дайын. Барлық компьютердің нәтижесін біріктіру үшін Supabase дерекқорын бір рет баптаңыз.</p></div></section><section class="panel" style="max-width:800px"><h2>Алғашқы баптау</h2><ol><li>Supabase жобасын жасаңыз.</li><li>SQL Editor ішінде <strong>setup.sql</strong> файлын орындаңыз.</li><li>Authentication → Users ішінде мұғалім аккаунтын жасаңыз.</li><li><strong>teacher-access.sql</strong> ішіндегі email-ді өзгертіп, SQL Editor-де орындаңыз.</li><li>Төменде Project URL және Publishable/anon key енгізіңіз, config.js жүктеп алып, репозиторийдегі ескі config.js орнына салыңыз.</li></ol><form onsubmit="makeConfig(event)"><label for="projectUrl">Project URL</label><input id="projectUrl" type="url" placeholder="https://your-project.supabase.co" required><label for="publicKey">Publishable key немесе anon public key</label><input id="publicKey" required placeholder="sb_publishable_..." autocomplete="off"><p class="notice">Тек ашық publishable немесе anon кілтін пайдаланыңыз. Secret / service_role кілтін енгізбеңіз.</p><button>config.js файлын жүктеу</button><div id="configError" class="feedback" role="alert"></div></form><p class="muted" style="margin-top:20px">Толық нұсқаулық: <a href="./README.md">README.md</a>. Сайтты жаңартқаннан кейін оқушы кабинеті ашылады.</p></section>`;
}
function makeConfig(e){
 e.preventDefault();const url=$('#projectUrl').value.trim().replace(/\/$/,'');const key=$('#publicKey').value.trim();
 try{
  if(!/^https:\/\/[a-z0-9.-]+$/i.test(url))throw Error('HTTPS Project URL енгізіңіз');
  if(key.startsWith('sb_secret_'))throw Error('Secret кілтін жариялауға болмайды');
  if(!key.startsWith('sb_publishable_')){
   let role='';try{const part=key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');role=JSON.parse(atob(part)).role}catch{}
   if(role!=='anon')throw Error('Publishable немесе anon public кілтін енгізіңіз');
  }
  download('config.js','window.BILIM_CONFIG = '+JSON.stringify({url,anonKey:key},null,2)+';\n','text/javascript');toast('config.js файлын GitHub репозиторийіне жүктеңіз');
 }catch(err){$('#configError').textContent=err.message}
}
function setRole(){$('#roleLabel').textContent=teacher?'Мұғалім кабинеті':'Оқушы кабинеті';$('#roleBtn').textContent=teacher?'Шығу':'Мұғалімге кіру'}
async function home(){clearInterval(interval);attempt=null;setRole();try{exams=await api('exams');if(teacher)results=await api('results');renderHome()}catch(e){app.innerHTML=`<div class="panel"><h2>Қосылу мүмкін болмады</h2><p>${esc(e.message)}</p><p>Интернет байланысын, config.js баптауын және Supabase ішінде setup.sql орындалғанын тексеріңіз.</p><button onclick="location.reload()">Қайталау</button></div>`}}
function renderHome(){const current=exams.filter(x=>!grade||x.grade===grade);app.innerHTML=`<section class="hero"><div><span class="eyebrow">Информатика · 5–9 сынып</span><h1>${teacher?'Бағалауды басқарыңыз.<br>Нәтижені бірден көріңіз.':'Біліміңді көрсет.<br>Өз нәтижеңді біл.'}</h1><p>${teacher?'БЖБ мен ТЖБ құрастырыңыз, оқушыларға ашыңыз және әр жұмыстың толық есебін алыңыз.':'Сыныбыңды және мұғалім ұсынған жұмысты таңда. Тапсырмаларды орындап, жауаптарыңды жібер.'}</p></div><div class="hero-art">{ &lt;/&gt; }<small>Ойлан. Орында. Үйрен.</small></div></section>${teacher?`<div class="stats"><div class="stat"><strong>${exams.length}</strong><span>Жинақтағы жұмыс</span></div><div class="stat"><strong>${results.length}</strong><span>Аяқталған жұмыс</span></div><div class="stat"><strong>${results.length?Math.round(results.reduce((s,r)=>s+r.result.percent,0)/results.length):'—'}${results.length?'%':''}</strong><span>Орташа нәтиже</span></div></div><div class="bar"><div class="tabs"><button class="${tab==='collection'?'on':''}" onclick="tab='collection';renderHome()">БЖБ жинағы</button><button class="${tab==='results'?'on':''}" onclick="tab='results';renderHome()">Оқушы нәтижелері</button></div><div class="row"><button class="secondary" onclick="importFile()">JSON жүктеу</button><button onclick="builder()">+ Жұмыс құрастыру</button></div></div>`:''}<div class="bar"><div><h2 style="margin:0">${tab==='results'?'Оқушы нәтижелері':'Бағалау жұмыстары'}</h2><span class="meta">${tab==='results'?'Жеке жауаптар мен қорытынды балдар':'Бөлім және тоқсан бойынша жиынтық бағалау'}</span></div><div class="tabs">${[0,5,6,7,8,9].map(g=>`<button class="${grade===g?'on':''}" onclick="grade=${g};renderHome()">${g?g+'-сынып':'Барлығы'}</button>`).join('')}</div></div>${tab==='results'&&teacher?resultsHTML():`<div class="notice">«Үлгі» белгісі бар жұмыстар — бағдарламаны таныстыруға арналған авторлық тапсырмалар. Нақты БЖБ ретінде қолданар алдында оқу мақсаттарына сәйкестігін тексеріңіз.</div><div class="grid">${current.map(x=>`<article class="card"><div class="row"><span class="badge">${x.grade}-сынып · ${esc(x.kind)}</span>${x.sample?'<span class="badge sample">Үлгі</span>':''}${!x.active?'<span class="badge sample">Жабық</span>':''}</div><h3>${esc(x.title)}</h3><p class="meta">${esc(x.section)}</p><p class="meta">${x.minutes} минут ${teacher?'· '+x.questions.length+' тапсырма · '+x.questions.reduce((s,q)=>s+q.points,0)+' балл':''}</p><div class="row">${teacher?`<button class="secondary" onclick="toggleExam('${x.id}')">${x.active?'Жабу':'Ашу'}</button><button class="ghost" onclick="exportExam('${x.id}')">JSON сақтау</button><button class="ghost" onclick="previewExam('${x.id}')">Көру</button>`:`<button onclick="startForm('${x.id}')">Жұмысты бастау</button>`}</div></article>`).join('')||'<div class="empty">Бұл сыныпта әзірге жұмыс жоқ.</div>'}</div>`}<footer>Bilim · Информатикаға арналған цифрлық бағалау ортасы · GitHub Pages · Жауаптар онлайн дерекқорда тексеріледі.</footer>`}
function resultsHTML(){const rr=results.filter(r=>!grade||r.exam.grade===grade);return `<div class="row" style="margin:15px 0"><button class="secondary" onclick="refreshResults()">Жаңарту</button><button class="secondary" onclick="csvExport()">Excel үшін CSV</button><span class="meta">${rr.length} жұмыс · Кесте «Жаңарту» батырмасымен жаңарады</span></div>${rr.length?`<div class="panel tablewrap"><table><thead><tr><th>Оқушы</th><th>Сынып</th><th>Жұмыс</th><th>Балл</th><th>Нәтиже</th><th>Есеп</th></tr></thead><tbody>${rr.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.class_name)}</td><td>${esc(r.exam.title)}</td><td>${r.result.score} / ${r.result.total}</td><td>${r.result.percent}%${r.result.late?' · Уақыт асты':''}</td><td><button class="secondary" onclick="report('${r.id}')">Толық есеп</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Әзірге аяқталған жұмыс жоқ. Оқушы жауаптарын жіберген соң осы жерден көрінеді.</div>'}`}
async function refreshResults(){try{results=await api('results');renderHome()}catch(e){toast(e.message)}}
async function toggleExam(id){try{await api('toggle',{id});await home()}catch(e){toast(e.message)}}
function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportExam(id){const x=exams.find(e=>e.id===id);const {id:i,active,...data}=x;download('BJB_'+x.grade+'.json',JSON.stringify(data,null,2))}
function previewExam(id){const x=exams.find(e=>e.id===id);app.innerHTML=`<button class="secondary" onclick="home()">Жинаққа оралу</button><div class="panel" style="margin-top:20px"><h2>${esc(x.title)}</h2>${x.questions.map((q,i)=>`<div class="report-item"><h3>${i+1}. ${esc(q.text)}</h3>${q.type==='choice'?q.options.map((o,j)=>`<div>${j===q.answer?'✓ ':''}${esc(o)}</div>`).join(''):`<p>Қабылданатын жауап: ${esc(q.answers.join(' / '))}</p>`}<small>${q.points} балл</small></div>`).join('')}</div>`}
function importFile(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{if(input.files[0].size>2000000)throw Error('Файл 2 МБ-тан аспауы керек');const parsed=JSON.parse(await input.files[0].text());const items=Array.isArray(parsed)?parsed:[parsed];if(!items.length||items.length>50)throw Error('1–50 жұмыс жүктеңіз');let count=0;for(const item of items){try{await api('exams',item);count++}catch(e){throw Error(count+' жұмыс жүктелді. Келесі жұмыста қате: '+e.message)}}toast(count+' жұмыс жүктелді');await home()}catch(e){toast(e.message)}};input.click()}
function newQuestion(){return {type:'choice',text:'',points:1,options:['','','',''],answer:0}}
function builder(){draft=[newQuestion()];app.innerHTML=`<div class="bar"><div><span class="eyebrow">Мұғалім құралы</span><h2 style="margin:6px 0">Жаңа бағалау жұмысы</h2></div><button class="secondary" onclick="home()">Бас тарту</button></div><form id="builderForm" onsubmit="saveExam(event)"><div class="panel formgrid"><div class="wide"><label for="title">Жұмыс атауы</label><input id="title" required maxlength="200" placeholder="Мысалы: Ақпаратты ұсыну"></div><div><label for="bg">Сынып</label><select id="bg">${[5,6,7,8,9].map(g=>`<option>${g}</option>`).join('')}</select></div><div><label for="kind">Бағалау түрі</label><select id="kind"><option>БЖБ</option><option>ТЖБ</option></select></div><div><label for="section">Бөлім</label><input id="section" required maxlength="200"></div><div><label for="minutes">Уақыт, минут</label><input id="minutes" type="number" value="20" min="1" max="180" required></div></div><div class="notice">Таңдау сұрақтары және қысқа нақты жауаптар автоматты тексеріледі. Қысқа жауапта әріп регистрі мен артық бос орын ескерілмейді. Ашық шығармашылық жауаптарға арналған бағалау бұл нұсқада жоқ.</div><div id="questions"></div><div class="toolbar"><button type="button" class="secondary" onclick="addQuestion()">+ Тапсырма</button><button type="submit">Жинаққа сақтау</button></div><div id="saveError" class="feedback" role="alert"></div></form>`;drawQuestions()}
function capture(){document.querySelectorAll('.question-editor').forEach((el,i)=>{const q=draft[i];q.text=el.querySelector('.qtext').value;q.points=Number(el.querySelector('.qpoints').value);if(q.type==='choice'){q.options=[...el.querySelectorAll('.opttext')].map(x=>x.value);q.answer=Number(el.querySelector('input[type=radio]:checked')?.value??0)}else q.answers=el.querySelector('.qanswers').value.split('|').map(s=>s.trim()).filter(Boolean)})}
function drawQuestions(){$('#questions').innerHTML=draft.map((q,i)=>`<section class="question-editor"><div class="bar" style="margin:0"><h3>Тапсырма ${i+1}</h3><button type="button" class="ghost" onclick="removeQuestion(${i})">Жою</button></div><label>Сұрақ мәтіні<textarea class="qtext" required maxlength="5000">${esc(q.text)}</textarea></label><div class="formgrid"><label>Түрі<select onchange="changeType(${i},this.value)"><option value="choice" ${q.type==='choice'?'selected':''}>Бір дұрыс жауап</option><option value="short" ${q.type==='short'?'selected':''}>Қысқа жауап</option></select></label><label>Балл<input class="qpoints" type="number" required min="1" max="20" value="${q.points}"></label></div>${q.type==='choice'?`<label>Дұрыс нұсқаны белгілеңіз</label>${q.options.map((o,j)=>`<div class="option-edit"><input aria-label="${j+1}-нұсқа дұрыс" type="radio" name="correct${i}" value="${j}" ${j===q.answer?'checked':''}><input class="opttext" required maxlength="1000" aria-label="${j+1}-нұсқа" placeholder="${j+1}-жауап нұсқасы" value="${esc(o)}"></div>`).join('')}`:`<label>Қабылданатын жауаптар (баламаларды | арқылы бөліңіз)<input class="qanswers" required value="${esc(q.answers.join(' | '))}" placeholder="алгоритм | algorithm"></label>`}</section>`).join('')}
function addQuestion(){capture();if(draft.length>=60){toast('Ең көбі 60 тапсырма');return}draft.push(newQuestion());drawQuestions()}
function removeQuestion(i){capture();if(draft.length===1){toast('Кемінде бір тапсырма қажет');return}draft.splice(i,1);drawQuestions()}
function changeType(i,type){capture();draft[i]={...draft[i],type,...(type==='short'?{answers:['']}:{options:['','','',''],answer:0})};drawQuestions()}
async function saveExam(e){e.preventDefault();capture();e.submitter.disabled=true;try{await api('exams',{title:$('#title').value,section:$('#section').value,grade:Number($('#bg').value),kind:$('#kind').value,minutes:Number($('#minutes').value),questions:draft,sample:false});toast('Жұмыс сақталды');await home()}catch(err){$('#saveError').textContent=err.message;e.submitter.disabled=false}}
function startForm(id){const x=exams.find(e=>e.id===id);modal(`<h2>${esc(x.title)}</h2><p class="muted">${x.grade}-сынып · ${x.minutes} минут</p><form onsubmit="begin(event,'${id}')"><label for="studentName">Аты-жөнің</label><input id="studentName" minlength="2" maxlength="100" required autocomplete="name"><label for="studentClass">Сыныбың</label><input id="studentClass" value="${x.grade}" maxlength="20" required placeholder="Мысалы: 7А"><p class="notice">Басталғаннан кейін уақыт жүреді. Терезені жаңартпа. Жауаптар осы қойындыда уақытша сақталады.</p><div id="startError" class="feedback" role="alert"></div><div class="dialog-actions"><button class="secondary" type="button" onclick="closeModal()">Бас тарту</button><button>Бастау</button></div></form>`)}
async function begin(e,id){e.preventDefault();e.submitter.disabled=true;try{const a=await api('start',{exam_id:id,name:$('#studentName').value,class_name:$('#studentClass').value});a.name=$('#studentName').value;a.class_name=$('#studentClass').value;a.answers=a.questions.map(()=>null);a.offset=a.server_now*1000-Date.now();attempt=a;persist();closeModal();renderAttempt()}catch(err){$('#startError').textContent=err.message;e.submitter.disabled=false}}
function persist(){if(attempt)sessionStorage.setItem('bilim_attempt',JSON.stringify(attempt))}
function renderAttempt(){setRole();$('#roleBtn').hidden=true;app.innerHTML=`<div class="bar"><div><span class="eyebrow">Орындау парағы</span><h2 style="margin:6px 0">${esc(attempt.title)}</h2><span class="muted">${esc(attempt.name)} · ${esc(attempt.class_name)}</span></div></div><div class="exam-layout"><div>${attempt.questions.map((q,i)=>`<section class="panel exam-q"><div class="bar" style="margin:0 0 12px"><span class="badge">${i+1}-тапсырма</span><span class="meta">${q.points} балл</span></div><h3 style="white-space:pre-wrap">${esc(q.text)}</h3>${q.type==='choice'?q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${attempt.answers[i]===j?'checked':''} onchange="answer(${i},${j})"><span>${esc(o)}</span></label>`).join(''):`<label>Жауабың<input maxlength="5000" value="${esc(attempt.answers[i]??'')}" oninput="answer(${i},this.value)" autocomplete="off"></label>`}</section>`).join('')}</div><aside class="panel sticky"><span class="meta">Қалған уақыт</span><div class="timer" id="timer">—</div><div class="progress"><span id="progressBar"></span></div><p id="answered" class="muted"></p><button style="width:100%" id="submitBtn" onclick="confirmSubmit()">Жауаптарды жіберу</button><div id="submitError" class="feedback" role="alert"></div><p class="meta" style="margin-top:14px">Нәтиже жауаптарды жіберген соң көрсетіледі.</p></aside></div>`;progress();clearInterval(interval);tick();interval=setInterval(tick,1000)}
function answer(i,v){attempt.answers[i]=v;persist();progress()}
function progress(){const n=attempt.answers.filter(x=>x!==null&&String(x).trim()!=='').length;$('#answered').textContent=n+' / '+attempt.questions.length+' тапсырма орындалды';$('#progressBar').style.width=(n/attempt.questions.length*100)+'%'}
function tick(){if(!attempt)return;const remaining=Math.max(0,Math.ceil((attempt.deadline*1000-Date.now()-attempt.offset)/1000));$('#timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('#timer').style.color=remaining<60?'#b32644':'';if(remaining===0&&!sending&&Date.now()>=nextAutoRetry)submitAttempt()}
function confirmSubmit(){const blank=attempt.answers.filter(x=>x===null||String(x).trim()==='').length;modal(`<h2>Жұмысты аяқтау</h2><p>${blank?blank+' тапсырма жауапсыз қалды. ':''}Жіберген соң жауаптарды өзгерту мүмкін болмайды.</p><div class="dialog-actions"><button class="secondary" onclick="closeModal()">Жалғастыру</button><button onclick="closeModal();submitAttempt()">Жіберу</button></div>`)}
async function submitAttempt(){if(sending||!attempt)return;sending=true;$('#submitBtn').disabled=true;try{const r=await api('submit',{id:attempt.id,answers:attempt.answers});clearInterval(interval);const name=attempt.name;attempt=null;sessionStorage.removeItem('bilim_attempt');if($('#modal').open)closeModal();$('#roleBtn').hidden=false;app.innerHTML=`<div class="panel" style="max-width:680px;margin:35px auto;text-align:center;padding:45px"><span class="badge">Жұмыс қабылданды</span><h1 style="margin:20px 0">Жарайсың, ${esc(name)}!</h1><p class="muted">Нәтижең мұғалім кабинетіне сақталды.</p><div class="result-number">${r.score} <span style="font-size:28px;color:var(--muted)">/ ${r.total}</span></div><p>Дұрыс орындалуы: <strong>${r.percent}%</strong></p>${r.late?'<p class="error">Уақыт шегінен кейін жіберілді. Балл есептелмеді. Мұғалімге хабарласыңыз.</p>':''}<button onclick="home()">Жинаққа оралу</button></div>`}catch(e){nextAutoRetry=Date.now()+10000;$('#submitError').textContent=e.message+' Жауаптар сақтаулы. Қайта жіберіңіз.'}finally{sending=false;if($('#submitBtn'))$('#submitBtn').disabled=false}}
function report(id){const r=results.find(x=>x.id===id),v=r.result;app.innerHTML=`<div class="bar no-print"><button class="secondary" onclick="tab='results';renderHome()">Нәтижелерге оралу</button><button onclick="window.print()">Басып шығару / PDF</button></div><article class="panel"><span class="eyebrow">Жеке қорытынды есеп</span><h1 style="margin:15px 0">${esc(r.exam.kind)} · Информатика</h1><h2>${esc(r.exam.title)}</h2><p><strong>Оқушы:</strong> ${esc(r.name)}<br><strong>Сыныбы:</strong> ${esc(r.class_name)}<br><strong>Бөлім:</strong> ${esc(r.exam.section)}<br><strong>Аяқталды:</strong> ${esc(new Date(r.submitted*1000).toLocaleString('kk-KZ'))}<br><strong>Орындау ұзақтығы:</strong> ${Math.floor(v.duration/60)} мин ${v.duration%60} сек</p><h2>Қорытынды: ${v.score} / ${v.total} балл · ${v.percent}%</h2><p class="meta">Жиынтық бағалау балы. Тоқсандық баға бөлек есептеледі.</p>${v.late?'<p class="error">Уақыт шегінен кейін жіберілген. Балл есептелмеді.</p>':''}${r.exam.questions.map((q,i)=>{const d=v.details[i],ans=d.answer;const shown=q.type==='choice'?(Number.isInteger(ans)?q.options[ans]:'Жауап жоқ'):(ans||'Жауап жоқ');return `<div class="report-item"><h3>${i+1}. ${esc(q.text)}</h3><p class="report-answer"><strong>Оқушы жауабы:</strong> ${esc(shown)}</p><p><strong>Жауап кілті:</strong> ${esc(q.type==='choice'?q.options[q.answer]:q.answers.join(' / '))}</p><strong class="${d.points?'success':'error'}">${d.points} / ${q.points} балл</strong></div>`}).join('')}<p style="margin-top:35px">Мұғалім: ____________________ &nbsp; Күні: ____________________</p></article>`}
function csvExport(){const rows=[['Оқушы','Сынып','Жұмыс','Түрі','Балл','Максимум','Пайыз','Аяқталды']];results.filter(r=>!grade||r.exam.grade===grade).forEach(r=>rows.push([r.name,r.class_name,r.exam.title,r.exam.kind,r.result.score,r.result.total,r.result.percent,new Date(r.submitted*1000).toLocaleString('kk-KZ')]));const safe=x=>{let s=String(x);if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('BJB_natizheler.csv','\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
window.addEventListener('beforeunload',e=>{if(attempt){e.preventDefault();e.returnValue=''}});
(async()=>{try{if(!configured()){showSetup();return}const saved=sessionStorage.getItem('bilim_attempt');if(saved){attempt=JSON.parse(saved);renderAttempt();return}if(token){try{await api('results');teacher=true}catch{token='';sessionStorage.removeItem('bilim_teacher');sessionStorage.removeItem('bilim_auth')}}await home()}catch(e){toast(e.message)}})();
</script></html>
